{% extends 'base.html' %}
<!-- Extends the base template to reuse its structure and styling -->
{% block title %}Home{% endblock %} 

{% block content %}
<h1 align="center">Notes</h1>
<ul class="list-group list-group-flush" id="notes">
  {% for note in user.notes %}
  <li class="list-group-item">
    <div class="mb-2">
      <input type="text" id="note-title-{{ note.id }}" class="form-control" value="{{ note.title or 'Untitled' }}" onblur="UpdateNote({{ note.id }}, this.value, document.getElementById('note-content-{{ note.id }}').value)">
    </div>
    <textarea id="note-content-{{ note.id }}" class="form-control" onblur="UpdateNote({{ note.id }}, document.getElementById('note-title-{{ note.id }}').value, this.value)">{{ note.data }}</textarea>
    <button type="button" class="close mt-2" onclick="DeleteNote({{ note.id }})">
      <span aria-hidden="true">&times;</span>
    </button>
  </li>
  {% endfor %}
</ul>
<form method="POST">
  <input type="text" name="title" id="title" class="form-control mb-2" placeholder="Note Title">
  <textarea name="note" id="note" class="form-control" placeholder="Note Content"></textarea>
  <br />
  <div align="center">
    <button type="submit" class="btn btn-primary">Add Note</button>
  </div>
</form>
{% endblock %}
