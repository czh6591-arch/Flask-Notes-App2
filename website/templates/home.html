{% extends 'base.html' %}
<!-- Extends the base template to reuse its structure and styling -->
{% block title %}Home{% endblock %} 

{% block content %}
<h1 align="center">Notes</h1>
<ul class="list-group list-group-flush" id="notes">
  {% for note in notes %}
  <li class="list-group-item">
    <div class="note-header">
      <input type="text" class="note-title" value="{{ note.title or '无标题' }}" onblur="UpdateNote({{ note.id }}, this.value, this.nextElementSibling.value)" />
      <span class="note-date">{{ note.date.strftime('%Y-%m-%d %H:%M:%S') }}</span>
      <button type="button" class="close" onclick="DeleteNote({{ note.id }})">
        <span aria-hidden="true">&times;</span>
      </button>
    </div>
    <textarea class="note-content" onblur="UpdateNote({{ note.id }}, this.previousElementSibling.previousElementSibling.value, this.value)">{{ note.data }}</textarea>
  </li>
  {% endfor %}
</ul>
<form method="POST">
  <input type="text" name="title" id="title" class="form-control" placeholder="笔记标题" />
  <br />
  <textarea name="note" id="note" class="form-control" placeholder="笔记内容"></textarea>
  <br />
  <div align="center">
    <button type="submit" class="btn btn-primary">Add Note</button>
  </div>
</form>
{% endblock %}
